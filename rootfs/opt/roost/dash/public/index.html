<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<title>roost</title>
<link rel="icon" href="icon.svg?v=__V__" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body data-route="projects" data-chat-open="false">

<header class="appbar">
  <a class="brand" href="#/projects" aria-label="roost home">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect class="bg" width="32" height="32" rx="8"/>
      <path class="perch" d="M6.5 24h19" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path class="fg" d="M10.5 22.5c0-4.6 2.6-8.2 6.7-8.2 1.5 0 2.6.5 3.6 1.5l3.1-1.5-1.5 3.1c.5 1 .5 2 .5 3.1 0 1-.5 2-1 2z"/>
    </svg>
    <span class="name">roost</span>
    <span class="host" id="host"></span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a class="tab" href="#/projects" data-nav="projects">Projects <span class="nav-badge" data-needs-badge hidden></span></a>
    <a class="tab" href="#/overview" data-nav="overview">Overview</a>
    <a class="tab" href="#/secrets" data-nav="secrets">Secrets</a>
  </nav>
  <button class="icon-btn" id="viewer-btn" type="button" aria-label="Viewer: browser and web previews" title="Viewer: browser and web previews" aria-pressed="false"></button>
  <span class="conn" id="conn" title="Status refreshes every 5 seconds"><span class="dot"></span><span>Live</span><span class="conn-time" id="conn-time"></span></span>
  <button class="icon-btn" id="theme-btn" type="button" aria-label="Colour theme: system"></button>
</header>

<div class="shell-row" id="shell-row">
<main class="views">
  <section class="view" id="view-projects" aria-label="Projects">
    <div class="projects-layout">
      <div class="tree-pane">
        <div class="view-scroll" id="tree-scroll">
          <div class="toolbar">
            <label class="search"><span class="sr-only">Filter projects and chats</span><input class="input" type="search" id="filter" placeholder="Filter projects and chats" autocomplete="off" enterkeyhint="search"></label>
            <div class="tb-row">
              <button class="toggle-chip" id="archived-btn" type="button" aria-pressed="false">Archived <span class="count" id="archived-count"></span></button>
              <span class="spacer"></span>
              <button class="icon-btn sm tb-desk" id="expand-all" type="button" aria-label="Expand all" title="Expand all"></button>
              <button class="icon-btn sm tb-desk" id="collapse-all" type="button" aria-label="Collapse all" title="Collapse all"></button>
              <button class="btn primary small" id="new-project" type="button"></button>
            </div>
          </div>
          <div class="tree" id="tree"></div>
          <div class="tree-foot" id="tree-foot"></div>
        </div>
      </div>
      <section class="chat-pane" id="chat-pane" aria-label="Chat"></section>
    </div>
  </section>

  <section class="view" id="view-overview" aria-label="Overview" hidden>
    <div class="view-scroll"><div class="ov" id="ov"></div></div>
  </section>

  <section class="view" id="view-secrets" aria-label="Keys and secrets" hidden>
    <div class="view-scroll"><div class="ov" id="secrets"></div></div>
  </section>
</main>
<div class="viewer-split" id="viewer-split" role="separator" aria-label="Resize viewer" title="Drag to resize, double-click to reset" hidden></div>
<aside class="viewer" id="viewer" aria-label="Viewer" hidden></aside>
</div>

<nav class="bottomnav" aria-label="Main">
  <a href="#/projects" data-nav="projects"></a>
  <a href="#/chat" data-nav="chat"></a>
  <a href="#/overview" data-nav="overview"></a>
  <a href="#/secrets" data-nav="secrets"></a>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="sheet menu" id="menu" aria-label="Actions"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="ui.js?v=__V__"></script>
<script src="secrets.js?v=__V__"></script>
<script src="viewer.js?v=__V__"></script>
<script src="app.js?v=__V__"></script>
</body>
</html>
