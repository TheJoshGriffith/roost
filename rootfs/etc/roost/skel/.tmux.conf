set -g mouse on
# tmux owns mouse drags. To select text for the system clipboard, hold Option (macOS) or
# Shift (Windows/Linux) while dragging in the web terminal, or run: tmux set -g mouse off
set -g set-clipboard on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour179,bold] roost #[fg=colour110]#S #[default]"
set -g status-left-length 40
set -g status-right "#[fg=colour244]Option/Shift-drag: copy · Ctrl-b s: sessions  %H:%M "
