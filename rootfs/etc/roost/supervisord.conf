; roost process supervisor. Generated configs live in /run/roost; logs in /config/roost/logs.
; ENV_ROOST_* toggles are normalised to true/false by roost-entrypoint.

[unix_http_server]
file=/run/roost/supervisor.sock
chmod=0770
chown=roost:roost

[supervisord]
nodaemon=true
user=root
logfile=/dev/fd/1
logfile_maxbytes=0
loglevel=info
pidfile=/run/roost/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/roost/supervisor.sock

; ---------------------------------------------------------------- web front door
[program:caddy]
command=/usr/bin/caddy run --config /run/roost/Caddyfile --adapter caddyfile
user=roost
priority=10
autorestart=true
stdout_logfile=/config/roost/logs/caddy.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:dash]
command=/usr/local/bin/node /opt/roost/dash/server.js
user=roost
priority=10
autorestart=true
stdout_logfile=/config/roost/logs/dash.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:ttyd]
command=/bin/bash -c 'rm -f /run/roost/ttyd.sock; exec /usr/local/bin/ttyd -i /run/roost/ttyd.sock -b /term -W -a -O -t titleFixed=roost -t disableLeaveAlert=true -t fontSize=14 /usr/local/bin/roost-term'
user=roost
directory=/workspace
priority=20
autorestart=true
stdout_logfile=/config/roost/logs/ttyd.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:code-server]
command=/usr/bin/code-server --bind-addr 127.0.0.1:8443 --auth none --disable-telemetry --disable-update-check --disable-getting-started-override /workspace
user=roost
directory=/workspace
priority=30
autostart=%(ENV_ROOST_CODE_SERVER)s
autorestart=true
stdout_logfile=/config/roost/logs/code-server.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:filebrowser]
command=/usr/local/bin/filebrowser -c /etc/roost/filebrowser.yaml
directory=/config/roost
user=roost
priority=30
autostart=%(ENV_ROOST_FILES)s
autorestart=true
stdout_logfile=/config/roost/logs/filebrowser.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

; ---------------------------------------------------------------- shared browser (VNC)
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_ROOST_SCREEN)s -nolisten tcp -ac
user=roost
priority=40
autostart=%(ENV_ROOST_BROWSER)s
autorestart=true
stdout_logfile=/config/roost/logs/xvfb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/roost-with-x /usr/bin/openbox
user=roost
priority=41
autostart=%(ENV_ROOST_BROWSER)s
autorestart=true
stdout_logfile=/config/roost/logs/openbox.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
redirect_stderr=true

[program:chromium]
command=/usr/local/bin/roost-with-x /usr/local/bin/roost-browser
user=roost
priority=42
autostart=%(ENV_ROOST_BROWSER)s
autorestart=true
startsecs=5
stdout_logfile=/config/roost/logs/chromium.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:x11vnc]
command=/usr/local/bin/roost-with-x /usr/local/bin/roost-vnc
user=roost
priority=43
autostart=%(ENV_ROOST_BROWSER)s
autorestart=true
stdout_logfile=/config/roost/logs/x11vnc.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=roost
priority=44
autostart=%(ENV_ROOST_BROWSER)s
autorestart=true
stdout_logfile=/config/roost/logs/novnc.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=0
redirect_stderr=true

; ---------------------------------------------------------------- agents & access
[program:claude-rc]
command=/usr/local/bin/roost-rc
user=roost
directory=/workspace
priority=50
autostart=%(ENV_ROOST_CLAUDE_RC)s
autorestart=true
stdout_logfile=/config/roost/logs/claude-rc.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e -f /run/roost/sshd_config
user=root
priority=60
autostart=%(ENV_ROOST_SSH)s
autorestart=true
stdout_logfile=/config/roost/logs/sshd.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
