name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Daily rebuild to pick up new Claude Code / Codex releases and base-image fixes.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x rootfs/usr/local/bin/roost-* host/deploy/roost-deploy-gate
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: dashboard syntax
        run: for f in rootfs/opt/roost/dash/*.js rootfs/opt/roost/dash/public/*.js; do node --check "$f" || exit 1; done

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Pinning to the resolved versions busts the layer cache whenever a new CLI ships.
          echo "claude=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"
          echo "codex=$(npm view @openai/codex version)" >> "$GITHUB_OUTPUT"
          echo "pwmcp=$(npm view @playwright/mcp version)" >> "$GITHUB_OUTPUT"
          echo "gh=$(gh release view -R cli/cli --json tagName -q .tagName | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "glab=$(curl -fsSL 'https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases?per_page=1' | jq -r '.[0].tag_name' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "roost=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            io.roost.claude-code=${{ steps.v.outputs.claude }}
            io.roost.codex=${{ steps.v.outputs.codex }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: roost:test
          build-args: |
            ROOST_VERSION=${{ steps.v.outputs.roost }}
            CLAUDE_CODE_VERSION=${{ steps.v.outputs.claude }}
            CODEX_VERSION=${{ steps.v.outputs.codex }}
            PLAYWRIGHT_MCP_VERSION=${{ steps.v.outputs.pwmcp }}
            GH_VERSION=${{ steps.v.outputs.gh }}
            GLAB_VERSION=${{ steps.v.outputs.glab }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ./scripts/smoke-test.sh roost:test

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ROOST_VERSION=${{ steps.v.outputs.roost }}
            CLAUDE_CODE_VERSION=${{ steps.v.outputs.claude }}
            CODEX_VERSION=${{ steps.v.outputs.codex }}
            PLAYWRIGHT_MCP_VERSION=${{ steps.v.outputs.pwmcp }}
            GH_VERSION=${{ steps.v.outputs.gh }}
            GLAB_VERSION=${{ steps.v.outputs.glab }}
          cache-from: type=gha
